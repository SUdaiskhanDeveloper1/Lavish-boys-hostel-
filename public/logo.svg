<svg width="360" height="96" viewBox="0 0 360 96" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lavish Boys Hostel">
  <defs>
    <linearGradient id="lbNavy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2A4A"/>
      <stop offset="1" stop-color="#0E1B33"/>
    </linearGradient>
    <linearGradient id="lbGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7D774"/>
      <stop offset="0.5" stop-color="#E0B94A"/>
      <stop offset="1" stop-color="#C69A2E"/>
    </linearGradient>
  </defs>

  <!-- Emblem -->
  <g transform="translate(8,8)">
    <rect x="0" y="0" width="80" height="80" rx="18" fill="url(#lbNavy)"/>
    <rect x="1.5" y="1.5" width="77" height="77" rx="16.5" fill="none" stroke="url(#lbGold)" stroke-width="1.5" opacity="0.8"/>

    <!-- Crown (the "lavish" mark) -->
    <path d="M25 24 L31 33 L40 22 L49 33 L55 24 L57 41 L23 41 Z" fill="url(#lbGold)"/>
    <circle cx="25" cy="24" r="2.6" fill="url(#lbGold)"/>
    <circle cx="40" cy="22" r="2.6" fill="url(#lbGold)"/>
    <circle cx="55" cy="24" r="2.6" fill="url(#lbGold)"/>

    <!-- Building / hostel -->
    <rect x="24" y="44" width="32" height="20" rx="1.5" fill="url(#lbGold)"/>
    <rect x="29" y="49" width="5" height="5" rx="0.8" fill="#0E1B33"/>
    <rect x="37.5" y="49" width="5" height="5" rx="0.8" fill="#0E1B33"/>
    <rect x="46" y="49" width="5" height="5" rx="0.8" fill="#0E1B33"/>
    <rect x="37.5" y="57.5" width="5" height="6.5" rx="0.8" fill="#0E1B33"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(104,0)">
    <text x="0" y="42" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="url(#lbGold)" letter-spacing="0.5">LAVISH BOYS</text>
    <text x="1" y="70" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" letter-spacing="7.5" fill="#8FA3C8">HOSTEL</text>
    <line x1="128" y1="61" x2="248" y2="61" stroke="url(#lbGold)" stroke-width="1.2" opacity="0.55"/>
  </g>
</svg>
